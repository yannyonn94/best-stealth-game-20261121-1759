<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATIK HEIST — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a1c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<noscript>BATIK HEIST needs JavaScript to play.</noscript>
<canvas id="game" aria-label="BATIK HEIST: steal 7 batik scrolls from the midnight museum, dodge the guards' vision cones, hide in dye vats, and escape through the skylight"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
